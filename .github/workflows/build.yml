name: OpenWrt + OpenClash + MosDNS (Standard Feeds)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk \
        gcc-multilib git libncurses5-dev libssl-dev python3 unzip \
        zlib1g-dev file wget rsync time qemu-utils libelf-dev
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt Base
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Inject Custom App via Standard Feeds
      run: |
        # 严格执行 GPT 推荐的标准正统插件机制：src-git → feeds
        echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> openwrt/feeds.conf.default
        echo "src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;v5" >> openwrt/feeds.conf.default

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Production Config
      run: |
        cd openwrt
        
        # 1. 网段与基础硬件锁定 (旁路由 192.168.0.2)
        sed -i 's/192.168.1.1/192.168.0.2/g' package/base-files/files/bin/config_generate
        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=16384" >> .config

        # 2. Web 管理界面核心包
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-compat=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config

        # 3. 编译引入 OpenClash (Mihomo 的图形化外壳及核心依赖)
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config

        # 4. 编译引入 mosdns (DNS 精洗及图形化界面)
        echo "CONFIG_PACKAGE_mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y" >> .config
        
        # 官方依赖关系自动对齐清洗
        make defconfig

    - name: Download packages
      run: |
        cd openwrt
        make download -j8

    - name: Compile Firmware
      run: |
        cd openwrt
        make -j2 || make -j1 V=s

    - name: Upload firmware to Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: openwrt-stable-${{ github.run_number }}
        files: openwrt/bin/targets/x86/64/*
