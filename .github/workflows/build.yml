name: Pure OpenWrt Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib git libncurses5-dev libssl-dev python3 unzip zlib1g-dev file wget rsync time qemu-utils libelf-dev ccache

      - name: Clone Official OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout v23.05.4  # 使用稳定的官方 Release 分支，不要用 master

      - name: Feeds Update
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Set Minimal Config
        run: |
          cd openwrt
          # 仅仅开启 x86_64 和基础 LuCI，没有任何插件
          cat > .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=4096
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-pure
          path: openwrt/bin/targets/x86/64/*
