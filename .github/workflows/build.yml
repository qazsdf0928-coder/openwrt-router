name: OpenWrt Ready-to-Use Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Prepare compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib git libncurses5-dev libssl-dev python3 unzip zlib1g-dev file wget rsync time qemu-utils libelf-dev ccache
        sudo timedatectl set-timezone "$TZ"

    - name: Cache Toolchain
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          ~/.ccache
        key: openwrt-ready-${{ env.REPO_BRANCH }}

    - name: Clone & Inject Feeds
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        echo "src-git mosdns https://github.com/sbwml/openwrt-mosdns.git" >> openwrt/feeds.conf.default
        cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Build Preparation
      run: |
        cd openwrt
        # 1. 基础配置目录
        mkdir -p files/etc/config
        
        # 2. dnsmasq 纯净 Stub 配置 (确保 DNS 链条由你掌控)
        cat > files/etc/config/dhcp <<EOF
config dnsmasq
    option noresolv '1'
    option nopoll '1'
    list server '127.0.0.1#5353'
EOF

        # 3. 编译配置 (加入 Argon 主题)
        cat >> .config <<EOF
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_ROOTFS_PARTSIZE=4096

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-compat=y
# UI 现代化主题
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-argon-config=y

# 核心插件
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_mosdns=y
CONFIG_PACKAGE_luci-app-mosdns=y
CONFIG_PACKAGE_luci-app-openclash=y

CONFIG_PACKAGE_ca-certificates=y
CONFIG_PACKAGE_curl=y
EOF
        make defconfig

    - name: Final Build
      run: |
        cd openwrt
        make download -j8
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifact
      uses: softprops/action-gh-release@v2
      with:
        tag_name: openwrt-ready-to-use
        files: openwrt/bin/targets/x86/64/*
