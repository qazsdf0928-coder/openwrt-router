name: OpenWrt Build (Stage 1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y git build-essential

    - name: Clone OpenWrt
      run: |
        git clone https://github.com/openwrt/openwrt.git

    - name: Done
      run: |
        echo "OpenWrt source cloned OK"
