name: OpenWrt Carrier-Grade Autonomous Build

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai
  MIHOMO_VER: v1.18.9

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Build Env
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib \
        git libncurses5-dev libssl-dev python3 unzip zlib1g-dev file wget rsync time \
        qemu-utils libelf-dev ccache

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          ~/.ccache
        key: openwrt-carrier-${{ env.REPO_BRANCH }}

    - name: Clone OpenWrt
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    # ========================
    # FEEDS + 固化依赖
    # ========================
    - name: Feeds Setup
      run: |
        cd openwrt
        echo "src-git mosdns https://github.com/sbwml/openwrt-mosdns.git" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ========================
    # OpenClash Core 固化
    # ========================
    - name: OpenClash Core Pin
      run: |
        cd openwrt
        mkdir -p package/luci-app-openclash
        wget -qO oc.tar.gz https://github.com/vernesong/OpenClash/archive/refs/tags/v0.46.073-beta.tar.gz
        tar -xzf oc.tar.gz -C package/luci-app-openclash --strip-components=1

        mkdir -p package/luci-app-openclash/root/etc/openclash/core

        curl -L --retry 5 -o mihomo.gz \
        https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}/mihomo-linux-amd64-compatible-${MIHOMO_VER}.gz

        gzip -t mihomo.gz
        gunzip mihomo.gz

        mv mihomo-* package/luci-app-openclash/root/etc/openclash/core/clash_meta
        chmod +x package/luci-app-openclash/root/etc/openclash/core/clash_meta

    # ========================
    # ⭐ 运行态自治核心补丁（关键）
    # ========================
    - name: Runtime Autonomy Patch (Carrier DNS + Failover + Order Lock)
      run: |
        cd openwrt
        mkdir -p files/etc/config
        mkdir -p files/etc/uci-defaults

        # --------------------
        # DNSMASQ：纯stub + 双fallback
        # --------------------
        cat > files/etc/config/dhcp <<EOF
config dnsmasq
    option domainneeded '1'
    option boguspriv '1'
    option rebind_protection '1'
    option expandhosts '1'
    option authoritative '1'
    option leasefile '/tmp/dhcp.leases'

    option noresolv '1'
    option cachesize '0'

    list server '127.0.0.1#5353'
    list server '223.5.5.5'
    list server '119.29.29.29'
EOF

        # --------------------
        # MOSDNS：唯一决策层 + fallback策略
        # --------------------
        cat > files/etc/config/mosdns <<EOF
config mosdns 'config'
    option listen_port '5353'
    option log_level 'error'
    option cache_size '8192'
    option custom_local_dns '223.5.5.5,119.29.29.29'
    option custom_remote_dns '8.8.8.8,1.1.1.1'
EOF

        # --------------------
        # OpenClash：纯执行层（禁止DNS参与）
        # --------------------
        cat > files/etc/config/openclash <<EOF
config openclash
    option core_auto_update '0'
    option auto_update '0'
    option dns_hijack '0'
EOF

        # --------------------
        # 启动顺序锁（解决竞态）
        # --------------------
        cat > files/etc/uci-defaults/99-carrier-order <<'EOF'
#!/bin/sh

# deterministic startup ordering
[ -f /etc/init.d/mosdns ] && sed -i 's/START=.*/START=60/' /etc/init.d/mosdns
[ -f /etc/init.d/dnsmasq ] && sed -i 's/START=.*/START=80/' /etc/init.d/dnsmasq
[ -f /etc/init.d/openclash ] && sed -i 's/START=.*/START=90/' /etc/init.d/openclash

exit 0
EOF
        chmod +x files/etc/uci-defaults/99-carrier-order

    # ========================
    # Build config
    # ========================
    - name: Build Config
      run: |
        cd openwrt

        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=4096" >> .config

        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config

        echo "CONFIG_PACKAGE_mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config

        echo "CONFIG_PACKAGE_ca-certificates=y" >> .config
        echo "CONFIG_PACKAGE_curl=y" >> .config

        make defconfig

    # ========================
    # Build
    # ========================
    - name: Build
      run: |
        cd openwrt
        make download -j8
        make -j$(nproc) || make -j1 V=s

    # ========================
    # Release
    # ========================
    - name: Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: openwrt-carrier-${{ github.run_number }}
        files: openwrt/bin/targets/x86/64/*
