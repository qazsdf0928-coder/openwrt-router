name: OpenWrt + OpenClash (Sovereign Core) + MosDNS (True Industrial Final)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Prepare compiler environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk \
        gcc-multilib git libncurses5-dev libssl-dev python3 unzip \
        zlib1g-dev file wget rsync time qemu-utils libelf-dev
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt Base
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: Inject True Closed-Loop MosDNS Feed (Version Locked)
      run: |
        cd openwrt
        # 工业级硬锁 1：锁定 sbwml 经过高强度测试、生产环境最稳的 v5 维护分支
        echo "src-git mosdns https://github.com/sbwml/openwrt-mosdns.git;v5" >> feeds.conf.default

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Standardize OpenClash & Secure Core Bake (Audited Pure Sovereign)
      run: |
        cd openwrt
        # 工业级硬锁 2：终结漂移！明确锁定 OpenClash 官方最稳的发布版本标签 v0.46.073-beta
        git clone --depth 1 --branch v0.46.073-beta https://github.com/vernesong/OpenClash.git openclash_temp
        mv openclash_temp/luci-app-openclash package/
        rm -rf openclash_temp
        
        # 预建运行目录
        mkdir -p package/luci-app-openclash/root/etc/openclash/core
        mkdir -p package/luci-app-openclash/root/etc/openclash/log

        # 工业级硬锁 3：断路器 + 基因锁机制！下载落盘后同时进行 sha256 签名校验与 gzip 完整性测试
        CORE_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.18.9/mihomo-linux-amd64-compatible-v1.18.9.gz"
        wget -O mihomo.gz "$CORE_URL"
        
        # 硬核校验：对比官方唯一的真实 Hash 值，对不上的直接掐断 CI，从源头上绝交供应链污染！
        echo "4e3fcba09907be80ee611a5b81b8cc9b6348c3b7a5a3a71b29a293ea9ccb7324  mihomo.gz" | sha256sum -c - || { echo "ERROR: Mihomo core SHA256 verification failed!"; exit 1; }
        gzip -t mihomo.gz || { echo "ERROR: Mihomo core gzip corrupted!"; exit 1; }
        
        gunzip mihomo.gz
        mv mihomo-linux-amd64-compatible-v1.18.9 package/luci-app-openclash/root/etc/openclash/core/clash_meta
        chmod +x package/luci-app-openclash/root/etc/openclash/core/clash_meta

    - name: Inject Safe Runtime Default Config (Defensive Control)
      run: |
        # 4. 彻底关闭 OpenClash 自动更新，防止运行期破坏固化好的内核结构
        mkdir -p openwrt/files/etc/config
        cat > openwrt/files/etc/config/openclash <<EOF
config openclash
    option core_auto_update '0'
    option auto_update '0'
EOF

    - name: Construct Clean Production Config (Zero Over-Control)
      run: |
        cd openwrt
        
        # 1. 硬件平台与旁路由静态 IP 闭环 (管理 IP 为 192.168.0.2)
        sed -i 's/192.168.1.1/192.168.0.2/g' package/base-files/files/bin/config_generate
        echo "CONFIG_TARGET_x86=y" >> .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=16384" >> .config

        # 2. Web Luci 支撑与底层高级虚拟网卡（全面承载未来的 TUN 透明代理链路）
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-compat=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config

        # 3. 引入应用组件
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y" >> .config

        # 4. 硬核保留 nftables 现代流控协议栈与防漏水证书依赖
        echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_iptables-nft=y" >> .config
        echo "CONFIG_PACKAGE_ca-certificates=y" >> .config
        echo "CONFIG_PACKAGE_curl=y" >> .config
        echo "CONFIG_PACKAGE_yq=y" >> .config
        
        make defconfig

    - name: Pre-download source packages
      run: |
        cd openwrt
        make download -j8

    - name: Execute Ultimate Stable Build
      run: |
        cd openwrt
        # 稳健的双线程输出，全量打包
        make -j2 || make -j1 V=s

    - name: Upload Verified Industrial Firmware to Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: openwrt-industrial-final-${{ github.run_number }}
        files: openwrt/bin/targets/x86/64/*
