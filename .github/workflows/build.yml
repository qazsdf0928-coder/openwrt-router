name: OpenWrt Simple Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib git libncurses5-dev libssl-dev python3 unzip zlib1g-dev file wget rsync time qemu-utils libelf-dev ccache
        
    - name: Clone OpenWrt
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt -b openwrt-24.10
        cd openwrt
        # 添加关键 Feeds
        echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
        echo "src-git mosdns https://github.com/sbwml/openwrt-mosdns.git" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Config
      run: |
        cd openwrt
        # 清空默认配置
        cat > .config <<EOF
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_ROOTFS_PARTSIZE=4096
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_kmod-tun=y
        CONFIG_PACKAGE_luci-app-openclash=y
        CONFIG_PACKAGE_mosdns=y
        CONFIG_PACKAGE_luci-app-mosdns=y
        CONFIG_PACKAGE_ca-certificates=y
        CONFIG_PACKAGE_curl=y
        EOF
        make defconfig

    - name: Build
      run: |
        cd openwrt
        make download -j8
        make -j$(nproc) || make -j1 V=s

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: openwrt-stable-build
        files: openwrt/bin/targets/x86/64/*
